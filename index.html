


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Non-OASIS Analyzer (Unified)</title>
    <style>
        /* --- GLOBAL LAYOUT (Dark Theme) --- */
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #0b1f2a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
        }

        .card {
            width: 650px;
            /* Slightly wider to accommodate data */
            background: #081821;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
            margin: 20px 0;
            position: relative;
            border: 1px solid #1f3a4d;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.5px;
            color: #e0e0e0;
        }

        p {
            font-size: 14px;
            opacity: 0.7;
            text-align: center;
            margin-bottom: 25px;
            color: #8daac2;
        }

        /* --- FILE INPUT --- */
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed #4fa3ff;
            background: #06141c;
            color: #fff;
            cursor: pointer;
            box-sizing: border-box;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        input[type="file"]:hover {
            border-color: #7abaff;
        }

        /* --- UPLOAD CARD STYLES --- */
        .upload-card {
            background: linear-gradient(180deg, #0c2230, #081821);
            border: 1px solid #1f3a4d;
            border-radius: 14px;
            padding: 22px;
        }

        .upload-header {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .upload-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(79, 163, 255, 0.15);
            color: #7abaff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .upload-title {
            font-size: 15px;
            font-weight: 600;
            color: #e4f1ff;
        }

        .upload-subtitle {
            font-size: 12px;
            color: #9bb9d4;
        }

        .upload-zone {
            border: 2px dashed #355a74;
            border-radius: 12px;
            padding: 26px;
            text-align: center;
            background: #06141c;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 16px;
        }

        .upload-zone:hover {
            border-color: #7abaff;
            background: #081d2a;
        }

        .upload-zone-icon {
            font-size: 30px;
            color: #7abaff;
            margin-bottom: 6px;
        }

        .upload-zone-text {
            font-size: 13px;
            font-weight: 600;
            color: #d6eaff;
        }

        .file-section-header {
            font-size: 13px;
            font-weight: 600;
            color: #cfe7ff;
            margin-bottom: 10px;
            display: none;
        }

        /* --- FILE LIST --- */
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border-radius: 12px;
            padding: 10px 14px;
            border: 1px solid #e6e6e6;
            transition: all 0.2s ease;
        }

        .file-item:hover {
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        .file-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .file-type-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #eef5ff;
            color: #4fa3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .file-meta {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .file-name {
            font-size: 13px;
            font-weight: 600;
            color: #1e1e1e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 260px;
        }

        .file-size {
            font-size: 11px;
            color: #6b6b6b;
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: #9b9b9b;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .remove-btn:hover {
            background: #ffecec;
            color: #d64545;
        }

        /* --- BUTTONS --- */
        .analyze-btn {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4fa3ff, #7abaff);
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #04121a;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .analyze-btn:not(:disabled):hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 30px rgba(79, 163, 255, 0.35);
        }

        .analyze-btn:disabled {
            background: #6b6b6b;
            color: #d1d1d1;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #4cff9f, #27ae60);
            color: #052e16;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        .save-btn:disabled {
            background: #7f8c8d;
            color: #fff;
            cursor: not-allowed;
        }

        /* --- PROGRESS --- */
        .progress-wrapper {
            display: none;
            margin-top: 18px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #9bb9d4;
            margin-bottom: 6px;
        }

        .progress-container {
            background: #102a3a;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4fa3ff, #7abaff);
            transition: width 0.4s ease;
        }

        /* --- RESULTS --- */
        #resultArea {
            display: none;
            margin-top: 25px;
            border-top: 1px solid #1f3a4d;
            padding-top: 20px;
        }

        .result-box {
            width: 100%;
            background: #050e13;
            color: #a6e22e;
            border: 1px solid #1f3a4d;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        textarea#jsonOutput {
            height: 200px;
        }

        textarea#f2fOutput {
            height: 100px;
            color: #ffc107;
        }

        /* Yellow for F2F */
        textarea#ptOtOutput {
            height: 150px;
            color: #82e0aa;
        }

        /* Green tint for PT/OT */

        label {
            font-size: 12px;
            color: #8daac2;
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
        }

        .success {
            color: #4cff9f;
        }

        .error {
            color: #ff7a7a;
        }

        .upload-disabled {
            pointer-events: none;
            opacity: 0.45;
        }

        .upload-disabled * {
            cursor: wait !important;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>AI Non-OASIS Analyzer</h2>
        <p>Extraction, PT/OT Eval, ICD-10 Audit & F2F</p>
        <div id="loadingMessage" style="text-align:center; color:#4fa3ff; margin-bottom:15px; font-weight:500;">
            Connecting to Salesforce...
        </div>

        <div id="mainControls" class="upload-card" style="display:none;">
            <div class="upload-header">
                <div class="upload-icon">📄</div>
                <div>
                    <div class="upload-title">Upload Clinical Documents</div>
                    <div class="upload-subtitle">
                        Face-to-Face, PT/OT Evals, Encounter Notes
                    </div>
                </div>
            </div>
            <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" multiple hidden
                    onchange="handleFileSelect(this)">
                <div class="upload-zone-icon">⬆️</div>
                <div class="upload-zone-text">Click to upload or drag files here</div>
            </div>
            <div id="fileSectionHeader" class="file-section-header">
                Uploaded Files (<span id="fileCount">0</span>)
            </div>
            <div id="fileListContainer" class="file-list"></div>
            <button id="analyzeBtn" class="analyze-btn" onclick="startAnalysis()">
                Analyze Documents
            </button>
        </div>

        <div id="progressWrapper" class="progress-wrapper">
            <div class="progress-label">
                <span id="progressText">Analyzing...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-container">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div id="status" class="status"></div>

        <div id="resultArea">
            <div style="display:block">
                <label>F2F Encounter Summary:</label>
                <textarea id="f2fOutput" class="result-box" readonly></textarea>

                <label>PT/OT Functional Assessment:</label>
                <textarea id="ptOtOutput" class="result-box" readonly placeholder="Waiting for analysis..."></textarea>

                <label>Final Audited Result (ICD-10 Compliant):</label>
                <textarea id="jsonOutput" class="result-box" readonly></textarea>
            </div>


        </div>
        <button id="saveBtn" class="save-btn" style="display:none" onclick="finalizeSave()">
            Save Data & Files
        </button>

    </div>
    <script>

        function disableUploadUI() {
            document.getElementById("mainControls").classList.add("upload-disabled");
        }

        function enableUploadUI() {
            document.getElementById("mainControls").classList.remove("upload-disabled");
        }

        /* =========================================================
           GLOBAL CONTEXT
           ========================================================= */
        let currentSessionLogs = [];
        let CHART_ID = null;
        let GEMINI_API_KEY = null;
        let SF_SESSION_ID = null;
        let SF_BASE_URL = null;
        let VECTOR_STORE_ID = null;
        let CACHED_AI_TIME = 0;

        // Array to store actual File objects
        let selectedFiles = [];

        // Using 2.5 Pro for Vision tasks (Diagnosis, PT/OT) and RAG
        const GEMINI_VISION_ENDPOINT = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-pro-preview:generateContent";
        const GEMINI_RAG_ENDPOINT = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-pro-preview:generateContent";

        /* =========================================================
           SALESFORCE CONNECTION
           ========================================================= */

        window.addEventListener("message", (event) => {
            if (event.data && event.data.type === "SF_CONTEXT") {
                console.log("✅ Received Context from Salesforce");

                CHART_ID = event.data.recordId;
                GEMINI_API_KEY = event.data.apiKey;
                SF_SESSION_ID = event.data.sessionId;
                SF_BASE_URL = event.data.baseUrl;
                // VECTOR_STORE_ID = event.data.vectorStoreId;
                VECTOR_STORE_ID = event.data.geminiFileStore;

                document.getElementById("loadingMessage").style.display = "none";
                document.getElementById("mainControls").style.display = "block";
            }
        });

        /* =========================================================
           FILE UI LOGIC
           ========================================================= */

        function handleFileSelect(inputElement) {
            if (inputElement.files && inputElement.files.length > 0) {
                for (let i = 0; i < inputElement.files.length; i++) {
                    selectedFiles.push(inputElement.files[i]);
                }
                renderFileList();
                inputElement.value = "";
            }
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderFileList();
        }

        function renderFileList() {
            const container = document.getElementById("fileListContainer");
            const header = document.getElementById("fileSectionHeader");
            const countSpan = document.getElementById("fileCount");

            container.innerHTML = "";

            if (selectedFiles.length === 0) {
                container.style.display = "none";
                header.style.display = "none";
                return;
            }

            header.style.display = "block";
            container.style.display = "flex";
            countSpan.innerText = selectedFiles.length;

            selectedFiles.forEach((file, index) => {
                const item = document.createElement("div");
                item.className = "file-item";

                const sizeMB = (file.size / 1024 / 1024).toFixed(2);

                item.innerHTML = `
            <div class="file-left">
                <div class="file-type-icon">📄</div>
                <div class="file-meta">
                    <div class="file-name" title="${file.name}">
                        ${file.name}
                    </div>
                    <div class="file-size">
                        ${sizeMB} MB
                    </div>
                </div>
            </div>
            <button class="remove-btn" onclick="removeFile(${index})" title="Remove file">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                    <path d="M10 11v6"></path>
                    <path d="M14 11v6"></path>
                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
                </svg>
            </button>
        `;
                container.appendChild(item);
            });
        }


        /* =========================================================
           PROGRESS BAR HELPER
           ========================================================= */

        function updateProgress(percent, text) {
            const wrapper = document.getElementById("progressWrapper");
            const fill = document.getElementById("progressFill");
            const textSpan = document.getElementById("progressText");
            const percentSpan = document.getElementById("progressPercent");

            wrapper.style.display = "block";
            fill.style.width = percent + "%";
            if (text) textSpan.innerText = text;
            percentSpan.innerText = percent + "%";
        }

        let progressTimer = null;
        let progressValue = 1;

        function startAutoProgress(target = 90, speed = 120) {
            clearInterval(progressTimer);

            progressTimer = setInterval(() => {
                if (progressValue < target) {
                    progressValue++;
                    updateProgress(progressValue);
                } else {
                    clearInterval(progressTimer);
                }
            }, speed);
        }

        function stopAutoProgress(finalValue = 100, text = "Complete") {
            clearInterval(progressTimer);
            progressValue = finalValue;
            updateProgress(progressValue, text);
        }


        /* =========================================================
           MAIN ANALYSIS LOGIC
           ========================================================= */

        async function startAnalysis() {
            const analyzeBtn = document.getElementById("analyzeBtn");
            const resultArea = document.getElementById("resultArea");
            const jsonOutput = document.getElementById("jsonOutput");
            const f2fOutput = document.getElementById("f2fOutput");
            const ptOtOutput = document.getElementById("ptOtOutput"); // Added

            // UI Reset
            resultArea.style.display = "none";
            jsonOutput.value = "";
            f2fOutput.value = "";
            ptOtOutput.value = ""; // Reset PT/OT
            showStatus("");

            // Validations
            if (!CHART_ID || !GEMINI_API_KEY) {
                showStatus("❌ Configuration missing. Refresh Salesforce page.", true);
                return;
            }

            if (selectedFiles.length === 0) {
                showStatus("❌ Please upload at least one file.", true);
                return;
            }
            try {
                analyzeBtn.disabled = true;
                disableUploadUI();
                analyzeBtn.innerText = "Analyzing...";

                // 🔵 Start progress
                progressValue = 1;
                updateProgress(1, "Initializing Batch...");
                startAutoProgress(90, 120);

                const startTime = Date.now();

                // --- STEP 1: READ FILES ---
                updateProgress(progressValue, `Processing ${selectedFiles.length} file(s)...`);
                const fileDataArray = await Promise.all(
                    selectedFiles.map(file => readFileAsBase64(file))
                );

                // --- STEP 2: PARALLEL AI EXECUTION (Diagnosis, F2F, and PT/OT) ---
                updateProgress(progressValue, "AI Running: Vision, F2F, and PT/OT Extraction...");

                const [rawExtraction, f2fSummaryText, ptOtResult] = await Promise.all([
                    callGeminiVisionMulti(fileDataArray), // Diagnosis
                    callGeminiF2FSummary(fileDataArray),  // F2F
                    runPtOtExtraction(fileDataArray)      // PT/OT (New)
                ]);

                // --- STEP 3: AUDIT DIAGNOSES (BATCH PROCESSING) ---
                updateProgress(progressValue, "AI Auditor: Batch Validating ICD-10 Rules...");
                
                let extractedDiagnoses = [];
                try {
                    const cleanRaw = rawExtraction.replace(/```json/g, "").replace(/```/g, "").trim();
                    extractedDiagnoses = JSON.parse(cleanRaw);
                } catch (e) {
                    console.error("Failed to parse Vision output as JSON:", e);
                }

                const auditedDiagnoses = [];
                // Process sequentially to avoid TPM quota exhaustion
                for (let i = 0; i < extractedDiagnoses.length; i++) {
                    const diag = extractedDiagnoses[i];
                    updateProgress(progressValue, `AI Auditor: Validating Code ${i + 1} of ${extractedDiagnoses.length}...`);
                    
                    try {
                        const auditResult = await callGeminiAuditor(JSON.stringify(diag));
                        
                        const jsonMatch = auditResult.match(/\[[\s\S]*\]/);
                        if (jsonMatch) {
                            auditedDiagnoses.push(...JSON.parse(jsonMatch[0]));
                        } else {
                            const cleanRes = auditResult.replace(/```json/g, "").replace(/```/g, "").trim();
                            auditedDiagnoses.push(...JSON.parse(cleanRes));
                        }
                    } catch (e) {
                        console.error(`Failed to process or parse Auditor output for diagnosis ${i + 1}:`, e);
                        // Push the original un-audited code as a fallback so we don't lose data
                        auditedDiagnoses.push(diag);
                    }
                }

                CACHED_AI_TIME = Math.floor((Date.now() - startTime) / 1000);

                // --- STEP 4: DISPLAY RESULTS ---
                // 1. Diagnosis JSON
                let prettyJson = JSON.stringify(auditedDiagnoses, null, 4);

                // 2. PT/OT JSON
                let prettyPtOt = ptOtResult;
                try {
                    const cleanPtOt = ptOtResult.replace(/```json/g, "").replace(/```/g, "").trim();
                    prettyPtOt = JSON.stringify(JSON.parse(cleanPtOt), null, 4);
                } catch { }

                jsonOutput.value = prettyJson;
                f2fOutput.value = f2fSummaryText;
                ptOtOutput.value = prettyPtOt; // Display PT/OT

                resultArea.style.display = "block";
                // display block of this button saveBtn
                document.getElementById("saveBtn").style.display = "block";


                // ✅ Finish progress
                stopAutoProgress(100, "Complete");

                setTimeout(() => {
                    document.getElementById("mainControls").style.display = "none";
                }, 500);

                showStatus("✅ Analysis Complete.", false);

            } catch (error) {
                console.error(error);
                stopAutoProgress(progressValue, "Failed");
                showStatus("❌ " + error.message, true);

            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.innerText = "Analyze Documents";
                enableUploadUI();
            }

        }

        /* =========================================================
           SAVE LOGIC (JSON + F2F + PT/OT + FILES)
           ========================================================= */

        async function finalizeSave() {
            const saveBtn = document.getElementById("saveBtn");
            const jsonOutput = document.getElementById("jsonOutput");
            const f2fOutput = document.getElementById("f2fOutput");
            const ptOtOutput = document.getElementById("ptOtOutput");

            try {
                saveBtn.disabled = true;

                // --- PART 1: SAVE JSON DATA, F2F, & PT/OT VIA APEX ---
                saveBtn.innerText = "Saving Data...";

                // We now pass rawJson, f2f, and ptOtJson
                await sendToSalesforce(
                    jsonOutput.value,
                    f2fOutput.value,
                    ptOtOutput.value,
                    CACHED_AI_TIME,
                    currentSessionLogs
                );

                // --- PART 2: UPLOAD FILES VIA STANDARD API ---
                if (selectedFiles.length > 0) {
                    saveBtn.innerText = `Uploading ${selectedFiles.length} Files...`;
                    await saveFilesToSalesforceRecord();
                }

                showStatus("✅ Data & Files Saved Successfully!", false);
                saveBtn.innerText = "Saved";
                setTimeout(() => {
                    window.location.href = `${SF_BASE_URL}/lightning/r/Chart__c/${CHART_ID}/view`;
                }, 800);

                setTimeout(() => {
                    saveBtn.disabled = true;
                    saveBtn.innerText = "Save Data & Files";
                }, 3000);

            } catch (e) {
                console.error(e);
                showStatus("❌ Save failed: " + e.message, true);
                saveBtn.disabled = false;
                saveBtn.innerText = "Save Data & Files";
            }
        }

        // 1. Send Data to Custom Apex REST API
        async function sendToSalesforce(rawJson, f2fSummary, ptOtJson, aiTimeSeconds, aiLogs) {
            const endpoint = `${SF_BASE_URL}/services/apexrest/non-oasis/ai-result`;
            const response = await fetch(endpoint, {
                method: "POST",
                headers: { "Authorization": "Bearer " + SF_SESSION_ID, "Content-Type": "application/json" },
                body: JSON.stringify({
                    chartId: CHART_ID,
                    rawJson: rawJson,
                    f2fSummary: f2fSummary,
                    ptOtJson: ptOtJson, // Added PT/OT to payload
                    aiTimeSeconds: aiTimeSeconds,
                    aiLogs: aiLogs
                })
            });
            if (!response.ok) throw new Error(await response.text());
        }

        // 2. Upload Files directly to ContentVersion (Standard Salesforce API)
        async function saveFilesToSalesforceRecord() {
            const endpoint = `${SF_BASE_URL}/services/data/v57.0/sobjects/ContentVersion`;

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];

                showStatus(`Uploading file ${i + 1} of ${selectedFiles.length}: ${file.name}...`, false);

                try {
                    const fileData = await readFileAsBase64(file);

                    const payload = {
                        "Title": file.name,
                        "PathOnClient": file.name,
                        "VersionData": fileData.base64,
                        "FirstPublishLocationId": CHART_ID,
                        "Origin": "H"
                    };

                    const response = await fetch(endpoint, {
                        method: "POST",
                        headers: {
                            "Authorization": "Bearer " + SF_SESSION_ID,
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        const errorCode = errorData[0]?.errorCode || "UNKNOWN";
                        const errorMessage = errorData[0]?.message || "Unknown error";
                        throw new Error(`Salesforce Error: ${errorCode} - ${errorMessage}`);
                    }

                    console.log(`✅ Upload Success: ${file.name}`);

                } catch (err) {
                    console.error(err);
                    showStatus(`❌ Failed to upload ${file.name}: ${err.message}`, true);
                }
            }
        }

        /* =========================================================
           API CALLS (GEMINI)
           ========================================================= */

        // --- 1. F2F Summary ---
        async function callGeminiF2FSummary(fileDataArray) {
            const f2fPrompt = `
You will receive multiple uploaded clinical documents.
Your job is to carefully READ and UNDERSTAND all documents using full medical reasoning.

Determine whether ANY file represents a clinical:
- Face-to-Face (F2F) visit note, OR
- Encounter note, OR
- Evaluation/assessment visit documentation, OR
- Any clinical document describing a direct meeting with the patient.

Do NOT rely on keywords. Use your understanding of medical documentation structure, tone, content, and intent.
If no such document exists, reply EXACTLY with: "No F2F document found."

If such a document EXISTS:
→ Provide a concise clinical summary UNDER 200 WORDS that includes:
   - Reason for visit
   - Key diagnoses or conditions mentioned
   - Symptoms or significant findings
   - Any plan, recommendations, or follow-up if mentioned

Summarize ONLY what is written. Never fabricate or assume.
    `;

            const parts = [{ text: f2fPrompt }];
            fileDataArray.forEach(f => {
                parts.push({
                    inlineData: { mimeType: f.mimeType, data: f.base64 }
                });
            });

            const response = await fetch(`${GEMINI_VISION_ENDPOINT}?key=${GEMINI_API_KEY}`, {

        // --- 4. RAG Auditor ---
        async function callGeminiAuditor(extractedText) {
            const auditorSystemPrompt = `
You are an Expert ICD-10-CM Medical Coding Auditor and Compliance Officer.
Your task is to perform a complete audit and produce a correct, conflict-free,
clinically validated, mandatory-rule-compliant, properly sequenced ICD-10-CM
diagnostic output.

You have FOUR authoritative knowledge sources:
1. File A — ICD-10-CM Excel Database (valid codes + official descriptions)

   (Only these clinically valid codes can be potential primary.)
4. File D — Coding Tip File
   (Guidelines, overrides, use additional code, sequencing adjustments.)

STRICT RULE — POTENTIAL PRIMARY LOGIC
======================================================================
A diagnosis can be "potentialPrimary" ONLY IF:
• It appears under “Potential Primary Diagnosis” in the input AND
• The ICD exists in File C AND
• Clinical Group (from File C) is NOT blank

potentialPrimary value MUST always be boolean (true or false).

======================================================================
GLOBAL RULE — EVERY CODE MUST BE CHECKED AGAINST ALL GUIDELINES
======================================================================
For EACH ICD code you output, YOU MUST:
• Validate the ICD from File A (code + description)
• Apply ALL applicable Tabular List rules from File B:
======================================================================
MANDATORY GROUNDING INSTRUCTION
======================================================================
You MUST use the fileSearch tool to query the database for EVERY SINGLE DIAGNOSIS AND CODE before making a decision. Do NOT rely on your internal knowledge. You must look up the code to verify its Excludes rules, whether it requires a 7th character, and if it is an unacceptable primary code.

======================================================================
UNIVERSAL HOME HEALTH CODING RULES (ALGORITHMIC VERIFICATION)
======================================================================
1. **Integral Symptoms Verification**: You MUST verify if a symptom is integral to a confirmed disease condition. If it is, DO NOT assign the symptom code. R-codes are NEVER acceptable as a Primary Diagnosis.
2. **Active vs Resolved Verification**: You MUST verify if the condition is currently receiving active treatment in home health. If the condition is resolved (e.g., healed wound, treated infection, acute condition resolved during an inpatient stay), DO NOT code it as active. Use history codes (Z87.-) if applicable.
3. **"With" Convention Verification**: You MUST query the Tabular List for the "with" convention for related conditions (e.g., Diabetes and Neuropathy, Hypertension and Heart Failure, Dementia and behavioral disturbances, Anemia and CKD/ESRD). If a combination code exists, you MUST use it.
4. **7th Character Verification**: For ANY trauma, fracture, or external cause, you MUST verify the 7th character in the Tabular List. If the patient is post-surgery or in home health (subsequent encounter), you MUST assign the correct 7th character (usually 'D').
5. **Primary Diagnosis Validity**: The Primary diagnosis MUST have a valid clinical group and reflect the focus of care listed in the Authorization. If the authorized focus is an unacceptable primary, assign a valid related code. Post-surgery status (Z47.-, Z48.-) should generally be primary when applicable.
6. **Sequencing Verification**: You MUST query the sequencing rules (Code First, Use Additional Code) for all diagnoses. (e.g., NSTEMI followed by CAD).
7. **Specificity Verification**: You MUST use the most specific code available (e.g., checking laterality, stage, or specific anatomical site).

======================================================================
MANDATORY CHAIN-OF-THOUGHT (CoT) PROCESS
======================================================================
Before outputting the final JSON, you MUST write a '<verification_log>' block.
For the provided diagnosis, you must write out your thought process:
1. Identify the diagnosis.
2. Query the fileSearch tool for "Excludes1", "With", and "7th character" rules for this diagnosis.

<verification_log>
- Diagnosis: Hypertension and Heart Failure.

- Result: Tabular list states HTN with Heart Failure maps to I13.0.
- Status: Valid, combined into I13.0.

After the '<verification_log>', output the final JSON array.

FINAL OUTPUT FORMAT (STRICT JSON — DO NOT CHANGE FIELD NAMES)
======================================================================

<verification_log>
...your step-by-step reasoning...
</verification_log>

\`\`\`json
[
  {

    "potentialPrimary": true or false
  }
]
\`\`\`

======================================================================
INPUT DIAGNOSIS TO AUDIT:
======================================================================

<medicalExtractText>
    `;

            const userPrompt = `INPUT:\n${extractedText}`;

            // let toolsConfig = [];

                        fileSearch: {
                            fileSearchStoreNames: [VECTOR_STORE_ID]
                        }

            // New code Here

            const requestBody = {
                system_instruction: { parts: [{ text: auditorSystemPrompt }] },
                contents: [{ parts: [{ text: userPrompt }] }],
                safetySettings: [
                    { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" }

            };
            
            if (tools.length > 0) {
                requestBody.tools = tools;
            }

            const response = await fetch(`${GEMINI_RAG_ENDPOINT}?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Audit Step Failed: ${response.status} - ${errText}`);
            }
            
            const data = await response.json();

            if (!data.candidates || data.candidates.length === 0) {
                console.error("Gemini API Error or Blocked Response:", data);
                if (data.promptFeedback && data.promptFeedback.blockReason) {
                    throw new Error(`Audit Step Blocked by Safety Filters: ${data.promptFeedback.blockReason}`);
                }
                throw new Error("Audit Step Failed: No candidates returned from Gemini API. " + JSON.stringify(data));
            }

            currentSessionLogs.push({
                description: "Audit Extraction",
                model: data.modelVersion || "unknown",
                responseId: data.responseId || "unknown",
                promptTokens: data.usageMetadata ? data.usageMetadata.promptTokenCount : 0,
                totalTokens: data.usageMetadata ? data.usageMetadata.totalTokenCount : 0
            });

            return data.candidates[0].content.parts[0].text;
        }

        function showStatus(message, isError = false) {
            const status = document.getElementById("status");
            status.innerHTML = `<span class="${isError ? 'error' : 'success'}">${message}</span>`;
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve({
                    mimeType: file.type,
                    base64: reader.result.split(",")[1],
                    name: file.name
                });
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
