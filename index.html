        function normalizeIcd(code) {
            if (!code) return '';
            return code.trim().toUpperCase().replace(/[^A-Z0-9.]/g, '');
        }

        function isIcdInRange(code, rangeStr) {
            const parts = rangeStr.split('-').map(s => normalizeIcd(s));
            if (parts.length !== 2) return false;
            const [start, end] = parts;
            const normCode = normalizeIcd(code);
            
            if (!normCode || !start || !end) return false;
            if (normCode[0] !== start[0]) return false;
            
            if (!start.includes('.') && !end.includes('.')) {
                const cat = normCode.split('.')[0];
                return cat >= start && cat <= end;
            }
            
            const startCat = start.split('.')[0];
            const endCat = end.split('.')[0];
            const codeCat = normCode.split('.')[0];
            
            if (startCat === endCat) {
                if (codeCat !== startCat) return false;
                const codeSub = normCode.split('.')[1] || '0';
                const startSub = start.split('.')[1] || '0';
                const endSub = end.split('.')[1] || 'Z';
                
                if (startSub.length === 1 && endSub.length === 1) {
                    const firstChar = codeSub[0];
                    return firstChar >= startSub && firstChar <= endSub;
                }
                
                return normCode >= start && normCode <= (end + 'Z');
            } else {
                return normCode >= start && normCode <= (end + 'Z');
            }
        }

        function matchCodeToRule(code, rule) {
            if (!rule.icd_codes) return false;
            const norm = normalizeIcd(code);
            const specs = rule.icd_codes.split('\n').map(s => s.trim()).filter(Boolean);
            for (const spec of specs) {
                const subSpecs = spec.split(',').map(s => s.trim()).filter(Boolean);
                for (const s of subSpecs) {
                    if (s.includes('-')) {
                        if (isIcdInRange(norm, s)) return true;
                    } else {
                        const single = normalizeIcd(s);
                        if (norm === single || norm.startsWith(single + '.')) return true;
                    }
                }
            }
            return false;
        }

        function evaluateScrubberCriteria(rule, scrubber) {
            const raw = ((rule.tagged_oasis_soc_roc || '') + '\n' + (rule.tagged_oasis_recert || '')).trim();
            if (!raw) {
                console.log(`%c[Criteria] Rule #${rule.id} ("${rule.body_system}"): No OASIS criteria attached -> UNCONDITIONALLY FULFILLED`, 'color: #81c784');
                return true;
            }
            if (!scrubber) {
                console.warn(`%c[Criteria] Rule #${rule.id} ("${rule.body_system}"): OASIS criteria required but no Scrubber record found in Salesforce -> SKIPPED`, 'color: #ffb74d');
                return false;
            }

            const fieldMatches = raw.match(/[A-Za-z0-9_]+__c/g) || [];
            const optionRegex = /(?:selected should (?:either )?be|should be|selected shoud be|selected should br)\s*[`]?([^\n\r]+)/i;
            const match = raw.match(optionRegex);
            let rawOptions = match ? match[1] : '';
            const digits = rawOptions.match(/\b\d+\b/g) || [];

            if (fieldMatches.length === 0 && /M1033/i.test(raw)) {
                fieldMatches.push('Functional_Points_M1033_Projected__c');
            }

            for (const f of fieldMatches) {
                const val = scrubber[f];
                // 1. Checkbox field: must be true
                if (f.startsWith('M1740_') || f.startsWith('N0415_') || f.startsWith('O0110_')) {
                    const isTrue = (val === true || val === 'true');
                    console.log(`   [Criteria] Rule #${rule.id} ("${rule.body_system}") | Checkbox ${f}: Value = ${val} -> ${isTrue ? '✅ PASS' : '❌ FAIL (Skipping rule)'}`);
                    if (!isTrue) return false;
                } 
                // 2. Numeric field
                else if (f.includes('1033')) {
                    const numVal = Number(val);
                    const expected = digits.length > 0 ? digits.map(Number) : [2];
                    const numPass = expected.includes(numVal);
                    console.log(`   [Criteria] Rule #${rule.id} ("${rule.body_system}") | Numeric ${f}: Value = ${val}, Expected = [${expected.join(', ')}] -> ${numPass ? '✅ PASS' : '❌ FAIL (Skipping rule)'}`);
                    if (!numPass) return false;
                } 
                // 3. Picklist field: match by option prefix
                else {
                    if (val === null || val === undefined || val === '') {
                        console.log(`   [Criteria] Rule #${rule.id} ("${rule.body_system}") | Picklist ${f}: Value is EMPTY/NULL -> ❌ FAIL (Skipping rule)`);
                        return false;
                    }
                    const strVal = String(val).trim();
                    if (digits.length > 0) {
                        const matchesPrefix = digits.some(d => strVal.startsWith(d));
                        console.log(`   [Criteria] Rule #${rule.id} ("${rule.body_system}") | Picklist ${f}: Value = "${strVal}", Required Prefixes = [${digits.join(', ')}] -> ${matchesPrefix ? '✅ PASS' : '❌ FAIL (Skipping rule)'}`);
                        if (!matchesPrefix) return false;
                    } else {
                        console.log(`   [Criteria] Rule #${rule.id} ("${rule.body_system}") | Picklist ${f}: Value = "${strVal}" -> ✅ PASS`);
                    }
                }
            }
            console.log(`%c[Criteria] Rule #${rule.id} ("${rule.body_system}"): ALL TARGET CRITERIA MET -> RULE FULFILLED! 🎯`, 'color: #4caf50; font-weight: bold;');
            return true;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function evaluatePocRocRules(extractedCodes, scrubber) {
            console.group("🩺 [Clinical Engine] Starting Rule Evaluation for Extracted ICD Codes");
            console.log("Extracted ICD-10 Codes:", extractedCodes);
            console.log("Scrubber Record:", scrubber ? scrubber.Id : "None");

            const fulfilledRules = [];
            const seenRuleIds = new Set();

            for (const code of extractedCodes) {
                for (const rule of BODY_SYSTEMS_RULES) {
                    if (matchCodeToRule(code, rule)) {
                        console.log(`🎯 Code ${code} matched Rule #${rule.id} [${rule.body_system}] (Parent: ${rule.parent_system})`);
                        if (evaluateScrubberCriteria(rule, scrubber)) {
                            if (!seenRuleIds.has(rule.id)) {
                                seenRuleIds.add(rule.id);
                                fulfilledRules.push({
                                    ...rule,
                                    matchedCodes: [code]
                                });
                            } else {
                                const existing = fulfilledRules.find(r => r.id === rule.id);
                                if (existing && !existing.matchedCodes.includes(code)) {
                                    existing.matchedCodes.push(code);
                                }
                            }
                        }
                    }
                }
            }

            console.log(`📋 Total Fulfilled Rules: ${fulfilledRules.length}`);
            if (fulfilledRules.length > 0) {
                console.table(fulfilledRules.map(r => ({
                    ID: r.id,
                    "Body System": r.body_system,
                    "Matched Codes": (r.matchedCodes || []).join(', '),
                    "Has Orders": !!(r.orders && r.orders.trim()),
                    "Has Goals": !!(r.goals && r.goals.trim())
                })));
            }
            console.groupEnd();

            const ordersHtml = fulfilledRules
                .filter(r => r.orders && r.orders.trim())
                .map(r => `<p><strong>${escapeHtml(r.body_system)}</strong>:<br/>${escapeHtml(r.orders.trim()).replace(/\n/g, '<br/>')}</p>`)
                .join('');

            const ordersText = fulfilledRules
                .filter(r => r.orders && r.orders.trim())
                .map(r => `${r.body_system}:\n${r.orders.trim()}`)
                .join('\n\n');

            const goalsText = fulfilledRules
                .filter(r => r.goals && r.goals.trim())
                .map(r => `${r.body_system}:\n${r.goals.trim()}`)
                .join('\n\n');

            const bodySystemsText = Array.from(new Set(fulfilledRules.map(r => r.body_system.trim()).filter(Boolean))).join('\n');
            const icdCodesText = Array.from(new Set(fulfilledRules.flatMap(r => r.matchedCodes || []))).join(', ');

            return {
                fulfilledRules,
                ordersHtml,
                ordersText,
                goals: goalsText,
                bodySystems: bodySystemsText,
                icdCodes: icdCodesText,
                fulfilledCount: fulfilledRules.length
            };
        }

        function updateProgress(percent, text) {
            const wrapper = document.getElementById("progressWrapper");
            const fill = document.getElementById("progressFill");
            const textSpan = document.getElementById("progressText");
            const percentSpan = document.getElementById("progressPercent");

            wrapper.style.display = "block";

        let progressTimer = null;
        let progressValue = 1;

        function startAutoProgress(target = 90, speed = 120) {
            clearInterval(progressTimer);

            progressTimer = setInterval(() => {
                if (progressValue < target) {
                    progressValue++;
                    updateProgress(progressValue);
                } else {
                    clearInterval(progressTimer);
                }
            }, speed);
        }

        function stopAutoProgress(finalValue = 100, text = "Complete") {
            clearInterval(progressTimer);
            progressValue = finalValue;
            updateProgress(progressValue, text);

        /* =========================================================

        async function startAnalysis() {
            const analyzeBtn = document.getElementById("analyzeBtn");
            const resultArea = document.getElementById("resultArea");
            const jsonOutput = document.getElementById("jsonOutput");
            const f2fOutput = document.getElementById("f2fOutput");
            const ptOtOutput = document.getElementById("ptOtOutput"); // Added

            // UI Reset
            resultArea.style.display = "none";
            jsonOutput.value = "";
            f2fOutput.value = "";
            ptOtOutput.value = ""; // Reset PT/OT
            if (document.getElementById("pocSummaryOutput")) document.getElementById("pocSummaryOutput").value = "";
            if (document.getElementById("pocOrdersOutput")) document.getElementById("pocOrdersOutput").value = "";
            if (document.getElementById("pocGoalsOutput")) document.getElementById("pocGoalsOutput").value = "";
            showStatus("");

            // Validations
            if (!CHART_ID || !GEMINI_API_KEY) {
                showStatus("❌ Configuration missing. Refresh Salesforce page.", true);
                return;
            }

            if (selectedFiles.length === 0) {
                showStatus("❌ Please upload at least one file.", true);
                return;
            }
            try {
                analyzeBtn.disabled = true;
                disableUploadUI();
                analyzeBtn.innerText = "Analyzing...";

                // 🔵 Start progress
                progressValue = 1;
                updateProgress(1, "Initializing Batch...");
                startAutoProgress(90, 120);

                const startTime = Date.now();

                // --- STEP 1: READ FILES ---
                updateProgress(progressValue, `Processing ${selectedFiles.length} file(s)...`);
                const fileDataArray = await Promise.all(
                    selectedFiles.map(file => readFileAsBase64(file))
                );

                // --- STEP 2: PARALLEL AI EXECUTION (Elite Auditor, F2F, and PT/OT) ---
                updateProgress(progressValue, "AI Running: Elite Auditor, F2F, and PT/OT Extraction...");

                const [rawExtraction, f2fSummaryText, ptOtResult] = await Promise.all([
                    callGeminiVisionMulti(fileDataArray), // Elite Auditor (Extraction + Audit combined)
                    callGeminiF2FSummary(fileDataArray),  // F2F
                    runPtOtExtraction(fileDataArray)      // PT/OT (New)
                ]);

                CACHED_AI_TIME = Math.floor((Date.now() - startTime) / 1000);

                // --- STEP 2.5: CLINICAL RULES & OASIS SCRUBBER CRITERIA EVALUATION ---
                updateProgress(progressValue, "Matching Clinical Body Systems & Scrubber Criteria...");
                
                let extractedCodes = [];
                try {
                    const cleanJson = rawExtraction.match(/\{[\s\S]*\}/);
                    if (cleanJson) {
                        const parsed = JSON.parse(cleanJson[0]);
                        if (parsed.finalCodes && Array.isArray(parsed.finalCodes)) {
                            extractedCodes = parsed.finalCodes.map(c => c.code).filter(Boolean);
                        }
                    }
                    if (extractedCodes.length === 0) {
                        const cleanArray = rawExtraction.match(/\[[\s\S]*\]/);
                        if (cleanArray) {
                            const parsedArray = JSON.parse(cleanArray[0]);
                            extractedCodes = parsedArray.map(c => c.code || c).filter(Boolean);
                        }
                    }
                } catch (e) {
                    console.error("Failed to parse codes for Body Systems matching:", e);
                }

                // Query Oasis_Scrubber__c for CHART_ID
                let scrubber = await fetchLatestOasisScrubber();

                // Evaluate rules against extractedCodes & scrubber
                EVALUATED_POC_ROC_DATA = evaluatePocRocRules(extractedCodes, scrubber);

                // --- STEP 3: DISPLAY RESULTS ---
                // 1. Diagnosis JSON
                let prettyJson = rawExtraction;
                try {
                    const cleanJson = rawExtraction.match(/\{[\s\S]*\}/);
                    if (cleanJson) {
                        prettyJson = JSON.stringify(JSON.parse(cleanJson[0]), null, 4);
                    } else {
                        // Fallback in case it returns an array instead of object
                        const cleanArray = rawExtraction.match(/\[[\s\S]*\]/);
                        if (cleanArray) {
                            prettyJson = JSON.stringify(JSON.parse(cleanArray[0]), null, 4);
                        }
                    }
                } catch (e) {
                    console.error("Failed to parse Elite Auditor output:", e);
                }

                // 2. PT/OT JSON
                let prettyPtOt = ptOtResult;
                try {
                    const cleanPtOt = ptOtResult.replace(/```json/g, "").replace(/```/g, "").trim();
                    prettyPtOt = JSON.stringify(JSON.parse(cleanPtOt), null, 4);
                } catch { }

                jsonOutput.value = prettyJson;
                f2fOutput.value = f2fSummaryText;
                ptOtOutput.value = prettyPtOt; // Display PT/OT

                // Display POC/ROC Results
                if (document.getElementById("pocSummaryOutput")) {
                    document.getElementById("pocSummaryOutput").value = 
                        `Matched Body Systems (${EVALUATED_POC_ROC_DATA.fulfilledCount}):\n` + 
                        (EVALUATED_POC_ROC_DATA.bodySystems || "None") + 
                        `\n\nMatched ICD Codes: ${EVALUATED_POC_ROC_DATA.icdCodes || "None"}`;
                }
                if (document.getElementById("pocOrdersOutput")) {
                    document.getElementById("pocOrdersOutput").value = EVALUATED_POC_ROC_DATA.ordersText || "No orders matched criteria.";
                }
                if (document.getElementById("pocGoalsOutput")) {
                    document.getElementById("pocGoalsOutput").value = EVALUATED_POC_ROC_DATA.goals || "No goals matched criteria.";
                }

                // resultArea.style.display = "block"; // output hidden on UI
                // display block of this button saveBtn
                document.getElementById("saveBtn").style.display = "block";


                // ✅ Finish progress
                stopAutoProgress(100, "Complete");

                setTimeout(() => {
                    document.getElementById("mainControls").style.display = "none";
                }, 500);

                showStatus("✅ Analysis Complete.", false);

            } catch (error) {
                console.error(error);
                stopAutoProgress(progressValue, "Failed");
                showStatus("❌ " + error.message, true);

            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.innerText = "Analyze Documents";
                enableUploadUI();
            }

        }

        // 1. Send Data to Custom Apex REST API
        async function sendToSalesforce(rawJson, f2fSummary, ptOtJson, aiTimeSeconds, aiLogs, pocData) {
            console.group("📤 [Apex REST] Sending Result to /services/apexrest/non-oasis/ai-result");
            const endpoint = `${SF_BASE_URL}/services/apexrest/non-oasis/ai-result`;
            const payload = {
                chartId: CHART_ID,
                rawJson: rawJson,
                f2fSummary: f2fSummary,
                ptOtJson: ptOtJson,
                aiTimeSeconds: aiTimeSeconds,
                aiLogs: aiLogs
            };
            if (pocData) {
                payload.pocOrders = pocData.ordersHtml || "";
                payload.pocGoals = pocData.goals || "";
                payload.pocBodySystems = pocData.bodySystems || "";
                payload.pocIcdCodes = pocData.icdCodes || "";
            }
            console.log("Apex Payload Keys:", Object.keys(payload));
            const response = await fetch(endpoint, {
                method: "POST",
                headers: { "Authorization": "Bearer " + SF_SESSION_ID, "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                const errText = await response.text();
                console.error("❌ [Apex REST] Error response:", errText);
                console.groupEnd();
                throw new Error(errText);
            }
            console.log("✅ [Apex REST] Request successfully processed by Salesforce!");
            console.groupEnd();

        // 2. Upload Files directly to ContentVersion (Standard Salesforce API)
        async function saveFilesToSalesforceRecord() {
            const endpoint = `${SF_BASE_URL}/services/data/v57.0/sobjects/ContentVersion`;

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];

                showStatus(`Uploading file ${i + 1} of ${selectedFiles.length}: ${file.name}...`, false);

                try {

                    const payload = {
                        "Title": file.name,
                        "PathOnClient": file.name,
                        "VersionData": fileData.base64,
                        "FirstPublishLocationId": CHART_ID,
                        "Origin": "H"
                    };

                    const response = await fetch(endpoint, {
                        method: "POST",
                        headers: {
                            "Authorization": "Bearer " + SF_SESSION_ID,
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        const errorCode = errorData[0]?.errorCode || "UNKNOWN";
                        const errorMessage = errorData[0]?.message || "Unknown error";
                        throw new Error(`Salesforce Error: ${errorCode} - ${errorMessage}`);
                    }

                    console.log(`✅ Upload Success: ${file.name}`);

                } catch (err) {
                    console.error(err);
                    showStatus(`❌ Failed to upload ${file.name}: ${err.message}`, true);
                }
            }
        }

        /* =========================================================

        // --- 1. F2F Summary ---
        async function callGeminiF2FSummary(fileDataArray) {
            const f2fPrompt = `
You will receive multiple uploaded clinical documents.
Your job is to carefully READ and UNDERSTAND all documents using full medical reasoning.

Determine whether ANY file represents a clinical:
- Face-to-Face (F2F) visit note, OR
- Encounter note, OR
- Evaluation/assessment visit documentation, OR
- Any clinical document describing a direct meeting with the patient.

Do NOT rely on keywords. Use your understanding of medical documentation structure, tone, content, and intent.
If no such document exists, reply EXACTLY with: "No F2F document found."

If such a document EXISTS:
→ Provide a concise clinical summary UNDER 200 WORDS that includes:
   - Reason for visit
   - Key diagnoses or conditions mentioned
   - Symptoms or significant findings
   - Any plan, recommendations, or follow-up if mentioned

Summarize ONLY what is written. Never fabricate or assume.
    `;

            const parts = [{ text: f2fPrompt }];
            fileDataArray.forEach(f => {
                parts.push({
                    inlineData: { mimeType: f.mimeType, data: f.base64 }
                });
            });

            const response = await fetch(`${GEMINI_VISION_ENDPOINT}?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: parts }] })
            });

            if (!response.ok) {
                const errorText = await response.text();
                console.error("F2F Summary failed. Status:", response.status, "Response:", errorText);
                console.warn("F2F Summary failed, returning default message.");
                return "No F2F document found.";
            }
            const data = await response.json();

            currentSessionLogs.push({
                description: "F2F Summary Extraction",
                model: data.modelVersion,
                responseId: data.responseId,
                promptTokens: data.usageMetadata.promptTokenCount,
                totalTokens: data.usageMetadata.totalTokenCount
            });


            let text = data.candidates[0].content.parts[0].text;
            return text.replace(/\*/g, "").trim();
        }

        // --- 2. Elite CDI Auditor (Combined Extraction & Audit) ---
        async function callGeminiVisionMulti(fileDataArray) {
            const extractionPrompt = `
Role: You are an elite, dual-certified Clinical Documentation Improvement (CDI) Specialist and Medical Auditor.

Objective: Read the provided clinical text. Extract all documented conditions to the highest level of specificity, then rigorously apply ALL ICD-10-CM Official Guidelines for Coding and Reporting (OGCR) and tabular instructional notes to output a finalized, compliant code list.

You MUST execute this task in four strict steps. Do your reasoning silently before generating the JSON output:

Step 1: Specific Extraction (Gather)
Extract ALL active, relevant documented medical conditions, symptoms, and histories. Map them to their correct raw ICD-10 codes.
CRITICAL EXTRACTION RULES:
- Specificity & Laterality: Extract codes to the highest level of specificity (e.g., left/right, acute/chronic, and 7th characters for injuries like initial/subsequent encounter). Do not use unspecified codes if the documentation supports a specific one.
- MEAT Criteria (Crucial): Only extract conditions that meet the MEAT criteria (Monitored, Evaluated, Assessed, or Treated) during the current encounter. DO NOT extract historical conditions from a 'Past Medical History' or 'Family History' list unless there is clear documentation that they are actively impacting the patient's current care plan or were assessed today.
- Z-Codes: Extract all relevant Z-codes, including preventative screenings, personal/family history of illness, and health status indicators (e.g., mobility status, BMI) ONLY IF they meet the MEAT criteria or are actively relevant to the current encounter.
- Exclusions: DO NOT extract conditions that are explicitly resolved, healed, or no longer receiving active treatment. DO NOT extract symptom codes (R-codes) if they are integral to a confirmed active disease condition.
- No Inference: Do not infer diagnoses from medications alone.

Step 2: Combination & Instructional Note Coding (Merge & Expand)
Review your raw list and apply ICD-10-CM Tabular List instructions.
- The "With" Guideline: If two conditions are linked by the word "with" in the ICD-10-CM Alphabetic Index (e.g., Diabetes with Neuropathy, or Hypertension with CKD), you MUST combine them into the appropriate combination code even if the provider did not explicitly link them in the text.
- Sequelae (Late Effects): If a current deficit is documented as the late effect of a past condition (e.g., hemiplegia due to old CVA), you MUST use the appropriate 'sequelae of' combination code and DROP the standalone symptom code. Always read the patient's history carefully to determine the exact underlying etiology (e.g., hemorrhage vs infarction).
- "Code first" & "Use additional code": Ensure you have captured both the underlying condition (etiology) and the manifestation if supported by the text.
- "Code also": Ensure both diagnoses are captured if clinically documented.

Step 3: Excludes1 & Excludes2 Scrubbing (Conflict Resolution)
Review the list for mutually exclusive codes.
- Excludes1: If two codes cannot be coded together, drop the less specific or precluded code.
- Excludes2: Note if two codes can coexist, but ensure they are both clinically supported as distinct conditions.

Step 4: Strict Sequencing & UHDDS (Order)
Order the surviving codes perfectly.
- Principal Diagnosis (UHDDS): Set potentialPrimary=true ONLY for the condition established after study to be chiefly responsible for occasioning the admission of the patient to the hospital/facility for care.
- Apply "Code first" rules strictly: if a manifestation code is present, its etiology code MUST be sequenced before it.
- Apply "Use additional code" rules: the additional code must immediately follow the primary code it describes.

Output: Return the result strictly adhering to the requested JSON schema. The JSON must contain your audit trail showing the raw codes, the rules you applied, and the final sequenced list.

====================================================
STRICT OUTPUT FORMAT (Return ONLY a JSON object)
Output a single JSON object containing the audit trail and final codes. Do not include markdown formatting or the \`\`\`json block. Just the raw JSON.

{
"auditTrail": {
"step1_rawExtraction": [""],
"step2_combinationsAndInstructions": ["<list of 'With', 'Combination', 'Sequelae', 'Code first', or 'Code also' logic applied>"],
"step3_scrubbing": ["<list of Excludes1/2 rules applied and codes dropped>"],
"step4_sequencing": ["<logic for principal diagnosis selection based on UHDDS and exact ordering>"]
},
"finalCodes": [
{
"code": "",
"diagnosis": "",
"potentialPrimary": true or false,
"reasonSource": "<why selected, specific guidelines applied, and where it was found in the text>"
}
]
}

CRITICAL RULES:

You MUST read every line of every uploaded file.

Missing any diagnosis is considered an audit failure.

YOU MUST NOT summarize, assume, or fabricate any diagnosis.

Before finalizing codes, USE the Google Search tool to look up the current ICD-10-CM Excludes1, Excludes2, and Combination rules for the specific codes you extracted to ensure absolute accuracy.

Every output must directly come from the uploaded files.
    `;

            const parts = [{ text: extractionPrompt }];
            fileDataArray.forEach(f => {
                parts.push({
                    inlineData: { mimeType: f.mimeType, data: f.base64 }
                });
            });

            const response = await fetch(`${GEMINI_VISION_ENDPOINT}?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: parts }],
                    tools: [{ googleSearch: {} }]
                })
            });

            if (!response.ok) {
                const errorText = await response.text();
                console.error("Vision Step Failed. Status:", response.status, "Response:", errorText);
                throw new Error("Vision Step Failed: " + errorText);
            }
            const data = await response.json();

            currentSessionLogs.push({
                description: "Vision Multi Extraction",
                model: data.modelVersion,
                responseId: data.responseId,
                promptTokens: data.usageMetadata.promptTokenCount,
                totalTokens: data.usageMetadata.totalTokenCount
            });


            return data.candidates[0].content.parts[0].text;
        }

        // --- 3. PT/OT Extraction (New Integrated Function) ---
        async function runPtOtExtraction(fileDataArray) {
            const prompt = `
    Role - You are an expert Medical Data Encoder.

    CRITICAL INSTRUCTION: 

    1. First, determine if any of the uploaded files is a specific Physical Therapy (PT) or Occupational Therapy (OT) Evaluation/Assessment.

    2. If the files are ONLY OASIS forms, physician encounter notes, or discharge summaries WITHOUT a dedicated PT/OT functional assessment section, you MUST return an empty JSON object: {}

    3. DO NOT guess information. If the specific functional levels (Max A, Min A, etc.) are not present in a PT/OT context, return {}.
 

    Task -  Extract functional assessment data from the attached Physical Therapy (PT) or Occupational Therapy (OT) documents and map the values to a specific JSON structure using strict standardization rules.

    1. Value Mapping Logic (Strict)

    You must convert the raw text found in the document (e.g., "Min A", "04", "CGA") into the exact string values listed in the Target Output (Required Value) column below.
    Use the Terms/Codes Found in Doc column to identify the correct match.

    Functional Level    Terms / Codes Found in Doc  Target Output (Required Value)
    6   06, Ind, Independent, I, Safe   "6"
    5   05, Mod I, Modified Independent, MI, Setup/Cleanup  "5"
    4   Walker/Cane used w/o assist, Assist with Device "4"
    4   Sup, Supervision, ST    "4"
    4   SBA, Stand By Assist, SC    "4"
    4   CGA, Contact Guard Assist, Caregiver Assist, Required Assistance    "4"
    3   03, Min A, Minimum Assist, PM, 25%  "3"
    3   Mod A, Moderate Assist, 50% "3"
    2   02, Max A, Max Assistance, SM, 75%  "2"
    1   01, Dep, Dependent, Total Assist, >75%, Unable  "1"
    NT  NT, N/A, Not Attempted, Not Tested  "NT"

    Note:
    If the document uses checkmarks, map the column header (e.g., MIN, MOD, MAX) to the corresponding Target Output.

    2. Extraction Instructions

    Determine Discipline
    Identify whether the document is PT or OT and populate only the relevant fields.

    Find Current Status
    Extract the CURRENT status only.
    Ignore values from Prior Level, Previous, or Goal columns.

    Ambiguity Handling

    If the value is PM, map to "3".

    If the value is SM, map to "2" (unless explicitly labeled Moderate).

    Null Handling

    If a field is not found in the document, exclude it from the JSON or set it to null.

    3. JSON Output Structure

    Return only a valid JSON object using the keys below. Do NOT use markdown code blocks.

    Occupational Therapy (OT) Fields

    (Only populate these if analyzing an OT document)

    Date_of_OT_Eval__c → Format: YYYY-MM-DD

    GG_OT_Feeding__c → Look for Eating / Feeding

    GG_OT_Oral_Hygiene__c → Look for Teeth / Dentures / Oral

    GG_OT_Grooming__c → Look for Grooming / Hygiene

    GG_OT_Toilet_Hygiene__c → Look for Toileting Hygiene / Clothing Management

    GG_OT_Bathing__c → Look for Bathing / Washing Body

    GG_OT_Upper_Body_Dressing__c → Look for Upper Body Dressing

    GG_OT_Lower_Body_Dressing__c → Look for Lower Body Dressing

    GG_OT_Sock_Shoes__c → Look for Footwear / Shoes / Socks

    If combined with Lower Body Dressing, use that score.

    GG_OT_Car_Van__c → Look for Car Transfer in OT section

    GG_OT_Toilet_Transfer__c → Look for Toilet Transfer in OT section

    Physical Therapy (PT) Fields

    (Only populate these if analyzing a PT document)

    GG_PT_Sit_Stand__c → Look for Sit to Stand transfer

    GG_PT_Bed_Wheelchair__c → Look for Bed to Chair / Wheelchair transfer

    GG_PT_Wheelchair_Bed__c → Look for Wheelchair to Bed transfer

    If not distinct, use Bed_Wheelchair value.

    GG_PT_Car_Van__c → Look for Car Transfer

    GG_PT_Toilet_Transfer__c → Look for Toilet Transfer / Commode

    GG_PT_Bathing__c → Look for Tub / Shower Transfer

    GG_PT_Level_10_Feet__c → Look for Ambulation / Gait – 10 ft

    GG_PT_Level_50_Feet__c → Look for Ambulation / Gait – 50 ft

    GG_PT_Level_150_Feet__c → Look for Ambulation / Gait – 150 ft

    GG_PT_Unlevel__c → Look for Uneven Surfaces

    GG_PT_1_Step__c → Look for 1 Step / Curb

    GG_PT_4_Steps__c → Look for 4 Steps

    GG_PT_12_Steps__c → Look for 12 Steps / Full Flight

    General Fields (All Documents)

    Complete_PT_OT_Eval__c → Always set to "Yes"

    Date_of_PT_OT_Eval__c → Date of evaluation (YYYY-MM-DD)

    Bed_Mobility__c → Look for Rolling Left / Right

    Transfer__c → Look for Supine to Sit / Sit to Supine

    Gait__c → Look for general ambulation if distances are not listed

    Wheelchair_Mobility__c → Look for Wheelchair use / propulsion

     Other__c → Look for Unlevel or Uneven Surfaces (Level / Unlevel / Uneven / Uneven surface / Walk on uneven surfaces and Populate this field using the same Value Mapping Logic defined above.)
    `;

            const parts = [{ text: prompt }];
            fileDataArray.forEach(f => {
                parts.push({ inlineData: { mimeType: f.mimeType, data: f.base64 } });
            });

            const response = await fetch(`${GEMINI_VISION_ENDPOINT}?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: parts }] })
            });

            if (!response.ok) {
                const errorText = await response.text();
                console.error("PT/OT Extraction failed. Status:", response.status, "Response:", errorText);
                console.warn("PT/OT Extraction failed");
                return "{}";
            }
            const data = await response.json();


            currentSessionLogs.push({
                description: "PT/OT Extraction",
                model: data.modelVersion,
                responseId: data.responseId,
                promptTokens: data.usageMetadata.promptTokenCount,
                totalTokens: data.usageMetadata.totalTokenCount
            });

            return data.candidates[0].content.parts[0].text;
        }



        /* =========================================================
           HELPERS
           ========================================================= */

        function showStatus(message, isError = false) {
            const status = document.getElementById("status");
            status.innerHTML = `<span class="${isError ? 'error' : 'success'}">${message}</span>`;
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve({
                    mimeType: file.type,
                    base64: reader.result.split(",")[1],
                    name: file.name
                });
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
